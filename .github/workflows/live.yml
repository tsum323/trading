name: Live forward test

# Перспективный тест trend-pullback на публичных данных Binance Spot (docs/validation-plan.md §6).
# Каждые 15 минут, через минуту после закрытия 15m-свечи: догрузить свечи, записать новые
# сигналы, оценить исходы, обновить отчёт и закоммитить всё в ветку `data`.
# Исполнения ордеров и API-ключей нет.

on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Символы через запятую"
        default: "BTC/USDT,ETH/USDT"

permissions:
  contents: write

# Циклы не должны пересекаться: каждый дописывает журналы в ветку `data`.
concurrency:
  group: live-forward-test
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/checkout-data.sh archive

      - name: Run one cycle
        run: npm run live -- --archive archive --symbols "$SYMBOLS"
        env:
          SYMBOLS: ${{ inputs.symbols || 'BTC/USDT,ETH/USDT' }}

      - name: Commit and push
        run: scripts/commit-data.sh archive "data: live cycle $(date -u +%Y-%m-%dT%H:%MZ) (code ${GITHUB_SHA::7})"
