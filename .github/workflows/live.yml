name: Live forward test

# Виртуальные трейдеры (docs/personas.md): бумажная торговля на публичных данных Binance Spot.
# Каждые 15 минут, через 2 минуты после закрытия 15m-свечи: догрузить свечи, дать каждому
# персонажу принять решения, оценить исходы, обновить personas/state.json и закоммитить всё
# в ветку `data`. Исполнения ордеров и API-ключей нет.

on:
  schedule:
    # Изменение строки cron заставляет GitHub перерегистрировать расписание (прежнее не срабатывало).
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Циклы не должны пересекаться: каждый дописывает журналы в ветку `data`.
concurrency:
  group: live-forward-test
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/checkout-data.sh archive

      - name: Run one cycle
        run: npm run personas -- --archive archive

      - name: Commit and push
        run: |
          scripts/commit-data.sh archive "data: personas cycle $(date -u +%Y-%m-%dT%H:%MZ) (code ${GITHUB_SHA::7})"
